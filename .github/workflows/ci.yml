name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hooks run on python3.12, which .pre-commit-config.yaml pins. Only
      # ubuntu-24.04 has it as the system Python.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      # Cache pre-commit environments for faster runs. Keyed by image and Python:
      # ubuntu-latest moves between images, and the environments hold interpreter paths.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.ImageOS }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dask]"
          pip install -e ".[dragon]" || echo "Dragon not available for Python ${{ matrix.python-version }}, skipping"

      - name: Run tests
        run: make test-ci
